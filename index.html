<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الريسبشن - إدارة الحجوزات</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <header class="main-header">
    <div class="header-container">
      <h1>لوحة الريسبشن - إدارة الحجوزات</h1>
      <p>عيادة الشروق للرعاية الطبية الشاملة</p>
    </div>
  </header>

  <div class="reception-card">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="tel" id="searchBar" placeholder="ابحث برقم الهاتف أو اسم المريض..." onkeyup="filterAppointments()">
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>الاسم ثلاثياً</th>
            <th>رقم الهاتف</th>
            <th>العيادة والطبيب</th>
            <th>نوع الكشف</th>
            <th>اليوم والموعد</th>
            <th>الحالة</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody id="appointmentsTable">
        </tbody>
      </table>
    </div>

    <div id="emptyState" class="empty-state">
      <i class="fa-solid fa-calendar-xmark" style="font-size: 2.5rem; color: #cbd5e1; margin-bottom: 10px;"></i>
      <p>لا توجد حجوزات مسجلة حالياً.</p>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://alshourk-clinic-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allAppointments = [];

    db.ref('appointments').on('value', (snapshot) => {
      let data = snapshot.val();
      allAppointments = [];
      if (data) {
        for (let key in data) {
          allAppointments.push(data[key]);
        }
      }
      renderTable(allAppointments);
    });

    function renderTable(list) {
      let tbody = document.getElementById('appointmentsTable');
      let emptyState = document.getElementById('emptyState');

      tbody.innerHTML = '';

      if (list.length === 0) {
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      list.reverse().forEach(app => {
        let tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${app.name}</strong></td>
          <td><a href="tel:${app.phone}">${app.phone}</a></td>
          <td>${app.clinic}</td>
          <td>${app.type}</td>
          <td>${app.day} - ${app.time}</td>
          <td><span class="status-badge">${app.status}</span></td>
          <td>
            <button onclick="updateStatus('${app.phone}', 'تم القبول')" style="background:#2e7d32; color:#fff; border:none; padding:5px 8px; border-radius:4px; cursor:pointer;">قبول</button>
            <button onclick="deleteBooking('${app.phone}')" style="background:#c53030; color:#fff; border:none; padding:5px 8px; border-radius:4px; cursor:pointer;">حذف</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterAppointments() {
      let query = document.getElementById('searchBar').value.toLowerCase();
      let filtered = allAppointments.filter(app => 
        app.name.toLowerCase().includes(query) || app.phone.includes(query)
      );
      renderTable(filtered);
    }

    function updateStatus(phone, newStatus) {
      db.ref('appointments/' + phone + '/status').set(newStatus);
    }

    function deleteBooking(phone) {
      if (confirm('هل أنت تأكد من حذف هذا الحجز؟')) {
        db.ref('appointments/' + phone).remove();
      }
    }
  </script>
</body>
</html>
