<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الريسبشن - عيادة الشروق</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #1b4d89;
      --primary-dark: #0f3057;
      --gold: #d4af37;
      --bg-light: #f4f7fb;
      --text-dark: #223354;
      --white: #ffffff;
      --shadow: 0 10px 30px rgba(27, 77, 137, 0.1);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-light); color: var(--text-dark); min-height: 100vh; padding: 20px 10px; }
    .header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: var(--white); padding: 20px; border-radius: var(--radius); text-align: center; margin-bottom: 20px; box-shadow: var(--shadow); }
    .header h1 { font-size: 1.5rem; margin-bottom: 5px; }
    .header p { color: var(--gold); font-weight: 700; font-size: 0.9rem; }
    .container { max-width: 650px; margin: 0 auto; }
    
    .search-box { background: var(--white); padding: 18px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid rgba(27, 77, 137, 0.1); }
    .search-box label { font-weight: 800; color: var(--primary-dark); display: block; margin-bottom: 8px; }
    .search-row { display: flex; gap: 8px; }
    .search-input { flex: 1; padding: 12px 15px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 1rem; outline: none; }
    .search-input:focus { border-color: var(--primary); }
    .btn-search { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 10px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 8px; }

    .card { background: var(--white); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 15px; border-right: 5px solid var(--primary); }
    .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #edf2f7; padding-bottom: 10px; margin-bottom: 10px; }
    .patient-name { font-size: 1.2rem; font-weight: 800; color: var(--primary-dark); }
    .card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9rem; font-weight: 600; }
    .info-item { display: flex; align-items: center; gap: 8px; color: #475569; }
    .info-item i { color: var(--gold); }
    .actions { margin-top: 15px; padding-top: 10px; border-top: 1px dashed #e2e8f0; display: flex; gap: 10px; flex-wrap: wrap; }
    .btn { border: none; padding: 8px 16px; border-radius: 8px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn-approve { background: #dcfce7; color: #15803d; }
    .btn-reject { background: #fee2e2; color: #b91c1c; }
    .btn-delete { background: #f1f5f9; color: #64748b; margin-right: auto; }
    .note-input { width: 100%; padding: 8px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; margin-top: 8px; font-size: 0.85rem; outline: none; }
    .badge { padding: 5px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 800; }
    .badge-pending { background: #fef3c7; color: #d97706; }
    .badge-approved { background: #dcfce7; color: #15803d; }
    .badge-rejected { background: #fee2e2; color: #b91c1c; }
    .empty-msg { text-align: center; padding: 30px; background: var(--white); border-radius: var(--radius); color: #64748b; font-weight: 700; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>لوحة الريسبشن - إدارة الحجوزات</h1>
      <p>عيادة الشروق للرعاية الطبية الشاملة</p>
    </div>

    <div class="search-box">
      <label><i class="fa-solid fa-magnifying-glass"></i> ابحث باسم المريض أو رقم الهاتف (اضغط Enter للبحث):</label>
      <div class="search-row">
        <input type="text" id="searchInput" class="search-input" placeholder="اكتب الاسم أو رقم الهاتف واضغط Enter..." onkeypress="handleKeyPress(event)" oninput="filterData()">
        <button class="btn-search" onclick="filterData()"><i class="fa-solid fa-search"></i> بحث</button>
      </div>
    </div>

    <div id="list">
      <div class="empty-msg">جاري تحميل الحجوزات من السحاب...</div>
    </div>
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbzTXhBrqqdXgL-ZA_k9cUthAlVJc47aVs3vcwyeJkEr6w7r3oZt8t6sdWCQyzpeYCYl/exec";
    let allBookings = [];

    function fetchBookings() {
      const oldScript = document.getElementById('jsonp-reception');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonp-reception';
      script.src = scriptURL + "?callback=renderData&t=" + Date.now();
      document.body.appendChild(script);
    }

    function renderData(data) {
      allBookings = data || [];
      filterData();
    }

    function render(data) {
      const list = document.getElementById('list');
      list.innerHTML = '';

      if (!data || data.length === 0) {
        list.innerHTML = `<div class="empty-msg"><i class="fa-solid fa-folder-open" style="font-size:2rem; margin-bottom:10px; display:block;"></i>لا توجد نتائج مطابقة للبحث.</div>`;
        return;
      }

      data.slice().reverse().forEach(item => {
        let badgeHtml = '';
        if (item.status === 'pending') badgeHtml = `<span class="badge badge-pending">⏳ قيد الانتظار</span>`;
        else if (item.status === 'approved') badgeHtml = `<span class="badge badge-approved">✅ تم القبول</span>`;
        else if (item.status === 'rejected') badgeHtml = `<span class="badge badge-rejected">❌ تم التأجيل/الرفض</span>`;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span class="patient-name">${item.name}</span>
            ${badgeHtml}
          </div>
          <div class="card-body">
            <div class="info-item"><i class="fa-solid fa-phone"></i> ${item.phone}</div>
            <div class="info-item"><i class="fa-solid fa-clock"></i> ${item.day} - ${item.time}</div>
            <div class="info-item" style="grid-column: span 2"><i class="fa-solid fa-user-doctor"></i> ${item.dept}</div>
            <div class="info-item" style="grid-column: span 2"><i class="fa-solid fa-notes-medical"></i> الكشف: ${item.service}</div>
          </div>
          
          <div style="margin-top: 10px;">
            <input type="text" id="note-${item.id}" class="note-input" placeholder="اكتب ملاحظة أو موعد بديل للمريض" value="${item.note || ''}">
          </div>

          <div class="actions">
            <button class="btn btn-approve" onclick="updateStatus('${item.id}', 'approved')"><i class="fa-solid fa-check"></i> قبول الموعد</button>
            <button class="btn btn-reject" onclick="updateStatus('${item.id}', 'rejected')"><i class="fa-solid fa-xmark"></i> رفض / تأجيل</button>
            <button class="btn btn-delete" onclick="deleteItem('${item.id}')"><i class="fa-solid fa-trash"></i> حذف</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        filterData();
      }
    }

    function filterData() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = allBookings.filter(i => (i.name && i.name.toLowerCase().includes(q)) || (i.phone && i.phone.toString().includes(q)));
      render(filtered);
    }

    async function updateStatus(id, newStatus) {
      const noteInput = document.getElementById(`note-${id}`);
      const noteVal = noteInput ? noteInput.value.trim() : '';

      try {
        await fetch(scriptURL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: "updateStatus", id: id, status: newStatus, note: noteVal })
        });
        alert('تم تحديث الحالة بنجاح!');
        setTimeout(fetchBookings, 1000);
      } catch (e) {
        alert('حدث خطأ أثناء التحديث.');
      }
    }

    async function deleteItem(id) {
      if (confirm('هل أنت متأكد من إزالة هذا الحجز؟')) {
        try {
          await fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: "deleteBooking", id: id })
          });
          alert('تم الحذف بنجاح!');
          setTimeout(fetchBookings, 1000);
        } catch (e) {
          alert('حدث خطأ أثناء الحذف.');
        }
      }
    }

    fetchBookings();
    setInterval(fetchBookings, 30000); // تحديث تلقائي كل 30 ثانية
  </script>
</body>
</html>
